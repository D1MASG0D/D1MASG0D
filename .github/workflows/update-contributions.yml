name: Update contribution card

on:
  schedule:
    - cron: "17 4 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Regenerate contributions.svg
        run: python scripts/make_contributions.py --user d1masg0d --out contributions.svg

      - name: Commit if the card changed
        run: |
          if git diff --quiet -- contributions.svg; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add contributions.svg
          git commit -m "chore: refresh contribution card"
          git push
